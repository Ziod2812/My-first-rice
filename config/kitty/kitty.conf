font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

window_padding_width 12
window_padding_height 10

background_opacity 0.92
dynamic_background_opacity yes

background #0B0D17
foreground #CDD6F4

cursor #CBA6F7
cursor_text_color #0B0D17
cursor_shape beam
cursor_blink_interval 0.6

selection_foreground #F5F5FF
selection_background #40305F

active_border_color #CBA6F7
inactive_border_color #45475A

color0 #0B0D17
color1 #F38BA8
color2 #A6E3A1
color3 #F9E2AF
color4 #89B4FA
color5 #CBA6F7
color6 #74D7F7
color7 #CDD6F4

color8 #45475A
color9 #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #7AA2F7
color13 #F5C2E7
color14 #89DCEB
color15 #F5F5FF

scrollback_lines 10000
scrollback_pager_history_size 0

enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no

confirm_os_window_close 0

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

active_tab_foreground #0B0D17
active_tab_background #CBA6F7
inactive_tab_foreground #A6ADC8
inactive_tab_background #313244

allow_remote_control yes
shell fish

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+q close_window
map ctrl+shift+f10 toggle_fullscreen
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard